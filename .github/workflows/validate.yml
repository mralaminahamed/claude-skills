name: Validate

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate plugin + skills
        run: python3 .github/scripts/validate_skills.py
