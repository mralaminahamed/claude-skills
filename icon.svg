<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003d5c"/>
      <stop offset="100%" stop-color="#0073aa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <rect width="512" height="256" rx="88" fill="url(#glow)"/>
  <rect y="176" width="512" height="80" fill="url(#glow)"/>

  <!-- WP wordmark -->
  <text x="256" y="300" font-family="'Arial Black',Impact,'Helvetica Neue',sans-serif"
        font-size="220" font-weight="900" fill="white" text-anchor="middle"
        letter-spacing="-8">WP</text>

  <!-- Skill nodes — neural / agent indicator -->
  <line x1="118" y1="390" x2="174" y2="390" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  <line x1="196" y1="390" x2="236" y2="390" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="276" y1="390" x2="316" y2="390" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="338" y1="390" x2="394" y2="390" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>

  <circle cx="104" cy="390" r="14" fill="rgba(255,255,255,0.2)"/>
  <circle cx="185" cy="390" r="20" fill="rgba(255,255,255,0.45)"/>
  <circle cx="256" cy="390" r="28" fill="rgba(255,255,255,0.9)"/>
  <circle cx="327" cy="390" r="20" fill="rgba(255,255,255,0.45)"/>
  <circle cx="408" cy="390" r="14" fill="rgba(255,255,255,0.2)"/>

  <!-- Accent line above nodes -->
  <rect x="72" y="350" width="368" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Corner sparkles -->
  <circle cx="96"  cy="96"  r="7" fill="rgba(255,255,255,0.35)"/>
  <circle cx="130" cy="72"  r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="72"  cy="130" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="416" cy="96"  r="7" fill="rgba(255,255,255,0.35)"/>
  <circle cx="440" cy="72"  r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="440" cy="130" r="4" fill="rgba(255,255,255,0.2)"/>
</svg>
